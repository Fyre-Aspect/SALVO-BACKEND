# ============================================================================
# Project Doe — Default Configuration
# ============================================================================

# Camera / video source
camera:
  source: 0                    # 0 = default webcam, or path to video file

# YOLO detector
detector:
  model_path: "yolov8n.pt"    # YOLOv8 nano — fast, good for prototyping
  confidence_threshold: 0.45  # Lowered from 0.5 — catches partially submerged persons
  device: "cpu"                # "cpu", "cuda", "mps"

# Object tracker
tracker:
  max_disappeared: 30          # Frames before dropping a lost track
  max_distance: 80.0           # Max pixel distance for centroid matching

# Distress analysis (heuristic — water-context features)
distress:
  motion_weight: 0.35          # Weight for erratic movement score
  submersion_weight: 0.35      # Weight for submersion detection
  stationary_weight: 0.15      # Weight for motionless floating
  face_emotion_weight: 0.15    # Weight for facial expression score (requires deepface)
  min_track_seconds: 1.0       # Min observation before heuristic scoring
  fps: 15.0                    # Expected FPS (for time-based calculations)
  gesture_score_floor: 0.95    # Score floor when a gesture is recognized

# Pose-based gesture classifier (SOS, drowning posture, etc.)
gesture:
  enabled: true
  model_path: "yolov8n-pose.pt"
  device: "cpu"
  detection_confidence: 0.4
  min_hold_frames: 6           # Frames a gesture must persist (~0.4s @ 15 FPS)
  wave_history_frames: 12      # Window for detecting wave oscillation
  wave_min_amplitude_px: 25.0  # Min lateral wrist sweep to count as a wave
  drowning_head_drop_px: 12.0  # Nose must be this many px BELOW shoulder line (lowered from 15)
  drowning_motion_px: 50.0     # Min wrist motion to confirm drowning thrash (lowered from 60)

# Facial expression distress scoring (optional — requires: pip install deepface tf-keras)
face_emotion:
  enabled: true
  analyze_every_n_frames: 5    # Run DeepFace every N frames per track (CPU budget)
  face_crop_top_ratio: 0.28    # Top 28% of person bbox = face region
  min_face_dimension_px: 32    # Skip crops smaller than this (distant/occluded persons)
  enforce_detection: false     # Don't error if no face found in the crop

# Alert thresholds — high so casual walking never fires;
# gesture detection bypasses these via gesture_score_floor.
alerting:
  warning_threshold: 0.6       # Score to trigger WARNING
  critical_threshold: 0.85     # Score to trigger CRITICAL
  warning_frames: 4            # Consecutive frames above warning threshold
  critical_frames: 6           # Consecutive frames above critical threshold
  cooldown_seconds: 15.0       # Cooldown after alert before re-alerting

# Serial communication (microcontroller)
serial:
  enabled: false               # Set to true when hardware is connected
  port: "COM4"                 # Windows: COM3, Linux: /dev/ttyUSB0
  baud_rate: 9600

# Deployment control
control:
  auto_arm: false              # Auto-arm on startup (use with caution)

# Web dashboard (operator view — separate from the SALVO-PWA-APP webapp,
# which runs on port 3000. Keep this off 3000 or the two collide.)
dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 8000

# Webhook — pushes distress alerts to the website backend
webhook:
  enabled: true                # SALVO webapp endpoint is live at localhost:3000
  url: "http://localhost:3000/api/distress"
  auth_token: ""               # Optional bearer token
  timeout_seconds: 5.0
  include_snapshot: true       # Embed a base64 JPEG of the alert frame
  snapshot_scale: 0.5
  only_critical: true          # Only fire on CRITICAL, not WARNING
  source_id: "drone-1"

# Logging
logging:
  log_dir: "logs"
  snapshot_on_alert: true

# Pipeline
pipeline:
  target_fps: 15
  show_preview: true           # Show OpenCV window with annotated feed
